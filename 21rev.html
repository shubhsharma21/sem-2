
<html>

    <title>Contact Details Form</title>

<body>

    <h1 align="center"><b>Contact Details</b></h1>

    <table align="center" width="500">
        <tr>
            <td>
                <form action="program" method="get">
                    <fieldset>
                        <p>Please enter your personal details:</p>
                        
                        <table border="0" width="100%">
                            <tr>
                                <td align="right">First name:*</td>
                                <td><input type="text" name="firstname" size="25" placeholder="Fred"></td>
                            </tr>
                            <tr>
                                <td align="right"> name:*</td>
                                <td><input type="text" name="lastname" size="25" placeholder="Bloggs"></td>
                            </tr>
                            <tr>
                                <td align="right">Street address:</td>
                                <td><input type="text" name="address" size="50" placeholder="Station Road"></td>
                            </tr>
                            <tr>
                                <td align="right">Town/city:</td>
                                <td><input type="text" name="city" size="25" placeholder="Dorkwell"></td>
                            </tr>
                            <tr>
                                <td align="right">Postcode/zip:</td>
                                <td><input type="text" name="postcode" size="15" placeholder="DW1 56A"></td>
                            </tr>z
                            <tr>
                                <td align="right">Telephone:</td>
                                <td><input type="text" name="telephone" size="25" placeholder="0123 456789"></td>
                            </tr>
                            <tr>
                                <td align="right">Mobile:</td>
                                <td><input type="text" name="mobile" size="25" placeholder="01567 899876"></td>
                            </tr>
                            <tr>
                                <td align="right">Email address:*</td>
                                <td><input type="text" name="email"  cellpadding= "1"
                                    size="50" placeholder="fbloggs@coldmail.net"></td>
                            </tr>
                        </table>

                        <p align="center">
                            Fields marked * are required.
                        </p>

                        <p align="center">
                            <input type="submit" placeholder="Submit">
                        </p>
                    </fieldset>
                </form>
            </td>
        </tr>
    </table>

</body>
</html>
