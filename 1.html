<html>
<body>
  
  <form>
    <table border="1" cellpadding="5" cellspacing="0">
      <tr>
        <tr><td colspan="2" align="center"><h2>Registration Form</h2></td></tr>
        <td>Student Name:</td>
        <td><input type="text" placeholder="Enter student name"name="studentName"></td>
      </tr>
      <tr>
        <td>Father's Name:</td>
    <td><input type="text" placeholde="Enter your father name" name="fatherName"></td>
      </tr>
      <tr>
        <td>Mother's Name:</td>
        <td><input type="text" placeholder="enter your mother name" name="motherName"></td>
      </tr>
      <tr>
        <td>Date of Birth (dd/mm/yyyy):</td>
        <td><input type="text" placeholder="Enter dob"
            name="dob"></td>
      </tr>
      <tr>
        <td>Gender:</td>
        <td>
          <input type="radio" name="gender" value="Male"> Male
          <input type="radio" name="gender" value="Female"> Female
        </td>
      </tr>
      <tr>
        <td>Email ID:</td>
        <td><input type="email" name="email"></td>
      </tr>
      <tr>
        <td>Mobile No.:</td>
        <td><input type="tel" placeholder="enter your mobile no" name="mobile"></td>
      </tr>
      <tr>
        <td>Address:</td>
        <td><textarea name="address" rows="4" cols="40"></textarea></td>
      </tr>
      <tr>
        <td>State:</td>
        <td><input type="text" name="state"></td>
      </tr>
      <tr>
        <td>City:</td>
        <td><input type="text" name="city"></td>
      </tr>
      <tr>
        <td colspan="2" align="center">
          <input type="submit" value="Submit">
        </td>
      </tr>
    </table>
  </form>
</body>
</html>
